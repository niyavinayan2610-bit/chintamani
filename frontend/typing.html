<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ചിന്താമണി - Problem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container typing-page">

        <div class="page-number">
            CHINTHA FILE No. 001
        </div>

        <div class="top-line">
            ✦ ✧ ✦
        </div>

        <h1 class="page-title">
            entha scene?
        </h1>

        <p class="typing-description">
            ninte problem ivide ezhuthu bro.
            simple aayalum complicated aayalum scene illa.
            Chindhamani athine kurich nokkikkolum.
        </p>

        <div class="problem-paper">

            <label for="situation">
                TODAY'S PROBLEM
            </label>

            <textarea
                id="situation"
                placeholder="example: ente friend message kandittum reply cheythilla..."
            ></textarea>

        </div>

        <button
            id="overthinkButton"
            class="vintage-button"
            onclick="overthink()"
        >
            ചിന്തിക്കാം
        </button>

        <p class="shortcut">
            Ctrl + Enter → faster chindha
        </p>

        <p
            id="errorMessage"
            class="error-message"
        ></p>

        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            ← back
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
